<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片英文单词提取工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-icon">📝</div>
        <h1>图片英文单词提取</h1>
        <p class="header-subtitle">上传图片 → OCR 识别 → 导出纯英文单词列表</p>
      </div>
      <div class="mode-selector">
        <label>OCR 模式</label>
        <select id="ocrMode">
          <option value="auto">⚡ 自动（API 优先）</option>
          <option value="api">☁️ 仅 API OCR</option>
          <option value="browser">🌐 仅浏览器 OCR</option>
        </select>
      </div>
    </header>

    <!-- Upload Panel -->
    <section class="panel">
      <div class="panel-header">
        <h2><span class="icon">⚙️</span>API 设置 &amp; 上传</h2>
      </div>
      <div class="panel-body">
        <!-- API Settings -->
        <div class="api-settings">
          <div class="api-field">
            <label>API Key（可选）</label>
            <input id="apiKeyInput" type="password" autocomplete="off" placeholder="填入后可使用 API OCR">
          </div>
          <div class="api-field">
            <label>API 地址</label>
            <input id="apiUrlInput" type="url" autocomplete="off" placeholder="https://api.xiaomimimo.com/v1/chat/completions">
          </div>
          <div class="api-field">
            <label>模型</label>
            <input id="apiModelInput" type="text" autocomplete="off" placeholder="mimo-v2.5">
          </div>
          <button id="toggleApiKeyBtn" type="button" class="btn-ghost btn-sm" title="显示/隐藏 API Key">👁️</button>
          <button id="saveApiKeyBtn" type="button" class="btn-primary btn-sm">💾 保存</button>
          <button id="clearApiKeyBtn" type="button" class="btn-ghost btn-sm">🗑️ 清除</button>
        </div>

        <!-- Drop Zone -->
        <label id="dropZone" class="drop-zone">
          <input id="fileInput" type="file" accept="image/*" multiple>
          <span class="drop-zone-icon">🖼️</span>
          <strong>点击或拖拽图片到这里</strong>
          <span>支持 PNG · JPG · WebP，可批量上传</span>
        </label>

        <!-- Action Bar -->
        <div class="action-bar" style="margin-top:14px">
          <button id="runBtn" type="button" class="btn-primary">🚀 开始识别</button>
          <button id="dedupeBtn" type="button" class="btn-ghost btn-sm">🔍 去重</button>
          <button id="sortBtn" type="button" class="btn-ghost btn-sm">🔤 排序</button>
          <div class="spacer"></div>
          <button id="downloadBtn" type="button" class="btn-ghost btn-sm">📥 导出 TXT</button>
          <button id="clearBtn" type="button" class="btn-danger btn-sm">🗑️ 清空</button>
        </div>

        <!-- Status -->
        <div id="status" class="status-bar">
          <span class="status-dot"></span>
          <span class="status-text">等待上传图片</span>
        </div>
      </div>
    </section>

    <!-- Workspace -->
    <section class="workspace">
      <!-- Preview -->
      <div class="panel">
        <div class="panel-header">
          <h2><span class="icon">🖼️</span>已选图片</h2>
        </div>
        <div class="panel-body">
          <div id="previewList" class="preview-list">
            <div class="preview-empty">
              <span class="icon">📷</span>
              <span>暂无图片，请先上传</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Result -->
      <div class="panel result-panel">
        <div class="panel-header">
          <h2><span class="icon">📋</span>识别结果</h2>
          <span id="wordCount" class="badge">0 个单词</span>
        </div>
        <textarea id="resultText" class="result-textarea" spellcheck="false" placeholder="识别出的英文单词会显示在这里，每行一个，可直接编辑校对……"></textarea>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
